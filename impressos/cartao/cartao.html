<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8">
<title>Cartão de visita — Humberto Bove</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400&family=DM+Sans:wght@400;500&display=block">
<style>
/* Desenho em px a 300 dpi: 1 mm = 11,811 px.
   Página com sangria 94 x 54 mm = 1110 x 638 px; corte 88 x 48 mm a 35 px de cada borda.
   Margem de segurança: texto a 82 px da borda (4 mm dentro do corte).
   Uso: ?face=frente|verso e &verniz=1 para a máscara de verniz.
   Na impressão (PDF) a página é reduzida para 94 x 54 mm; na tela fica em 1110 x 638. */
:root{
  --marrom:#855e3e; --creme:#fbf4e8; --creme-claro:#fffbf5; --texto:#33281f; --texto-suave:#7a6957;
  --dourado-arco:#f0d59a; --dourado-ponto:#c9973f; --dourado-texto:#835e22; --hairline:#ebdcc6;
}
@page{size:94mm 54mm;margin:0}
*{box-sizing:border-box}
html,body{margin:0;padding:0;-webkit-print-color-adjust:exact;print-color-adjust:exact}
html.frente{background:var(--marrom)}
html.verso{background:var(--creme)}
html.verniz{background:#fff}
.pagina{width:1110px;height:638px;position:relative;overflow:hidden}
@media print{.pagina{transform:scale(.32);transform-origin:0 0}}

/* ---------- Frente ---------- */
.frente .pagina{display:flex;flex-direction:column;align-items:center;justify-content:center;color:var(--creme-claro);text-align:center}
.local{position:absolute;top:90px;left:0;right:0;font:500 15px/1 "DM Sans",sans-serif;letter-spacing:.14em;text-transform:uppercase;color:rgba(255,251,245,.66)}
.nome{font:300 96px/1 "Montserrat",sans-serif;letter-spacing:-.005em;margin-top:6px}
.oficio{margin-top:26px;font:400 28px/1 "Montserrat",sans-serif;letter-spacing:.5em;margin-right:-.5em;text-transform:uppercase}
.arcos{position:absolute;width:300px;height:300px;overflow:visible}
.arcos circle{fill:none;stroke:var(--dourado-arco);stroke-width:2.5}
/* centro dos círculos no canto do corte: a curva continua na sangria */
.arcos.ie{left:35px;top:302px}
.arcos.sd{left:774px;top:35px}

/* ---------- Verso ---------- */
.verso .pagina{display:flex;gap:36px;padding:82px 82px 82px 82px}
.esq{flex:1;min-width:0;display:flex;flex-direction:column;justify-content:center;gap:28px}
.rotulo{font:500 15px/1 "DM Sans",sans-serif;letter-spacing:.24em;text-transform:uppercase;color:var(--dourado-texto);margin-bottom:16px}
.servicos{list-style:none;margin:0;padding:0;display:grid;grid-template-columns:auto auto;column-gap:34px;row-gap:11px;justify-content:start}
.servicos li{display:flex;align-items:center;gap:10px;font:400 21px/1.25 "DM Sans",sans-serif;color:var(--texto);white-space:nowrap}
.servicos li::before{content:"";width:7px;height:7px;border-radius:50%;background:var(--dourado-ponto);flex:none}
.contatos{border-top:1px solid var(--hairline);padding-top:18px;display:grid;grid-template-columns:auto auto;column-gap:30px;row-gap:12px;justify-content:start}
.ct{display:flex;align-items:flex-start;gap:12px;font:400 20px/1.3 "DM Sans",sans-serif;color:var(--texto)}
.ct.forte{font-size:23px;font-weight:500}
.ct svg{width:20px;height:20px;flex:none;margin-top:3px;fill:none;stroke:var(--marrom);stroke-width:1.75;stroke-linecap:round;stroke-linejoin:round}
.ct.forte svg{width:22px;height:22px}
.coluna{width:260px;flex:none;background:var(--marrom);border-radius:18px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px}
.caixa-qr{width:184px;height:184px;background:var(--creme-claro);border-radius:8px;padding:12px}
.caixa-qr img{width:100%;height:100%;display:block}
.chamada{font:500 16px/1.4 "DM Sans",sans-serif;letter-spacing:.2em;margin-right:-.2em;text-transform:uppercase;color:var(--creme-claro);text-align:center}

/* ---------- Máscara de verniz: preto onde brilha, branco no resto ---------- */
.verniz .pagina *{visibility:hidden}
.verniz .com-verniz,.verniz .com-verniz *{visibility:visible;color:#000}
.verniz .arcos circle{stroke:#000}
.verniz .coluna{visibility:visible;background:#000}
/* o QR fica sem verniz, com 1,5 mm (18 px) de folga em volta */
.verniz .caixa-qr{visibility:visible;background:#fff;box-shadow:0 0 0 18px #fff;border-radius:8px}
.verniz .caixa-qr img{visibility:hidden}
</style></head>
<body>
<div class="pagina" id="pagina"></div>

<template id="t-frente">
  <span class="local">Consultório — Serrana, SP</span>
  <span class="nome com-verniz">Humberto Bove</span>
  <span class="oficio com-verniz">Massoterapeuta</span>
  <svg class="arcos ie com-verniz" viewBox="0 0 300 300"><circle cx="0" cy="300" r="70"/><circle cx="0" cy="300" r="110"/><circle cx="0" cy="300" r="150"/></svg>
  <svg class="arcos sd com-verniz" viewBox="0 0 300 300"><circle cx="300" cy="0" r="70"/><circle cx="300" cy="0" r="110"/><circle cx="300" cy="0" r="150"/></svg>
</template>

<template id="t-verso">
  <div class="esq">
    <div>
      <div class="rotulo">Atendimentos</div>
      <ul class="servicos">
        <li>Massagem relaxante</li><li>Quiropraxia</li>
        <li>Massagem modeladora</li><li>Acupuntura</li>
        <li>Drenagem linfática</li><li>Auriculoterapia</li>
        <li>Massagem terapêutica</li><li>Ventosaterapia</li>
        <li>Pedras quentes</li>
      </ul>
    </div>
    <div class="contatos">
      <span class="ct forte"><svg viewBox="0 0 24 24"><path d="M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07 19.5 19.5 0 0 1-6-6 19.79 19.79 0 0 1-3.07-8.67A2 2 0 0 1 4.11 2h3a2 2 0 0 1 2 1.72 12.84 12.84 0 0 0 .7 2.81 2 2 0 0 1-.45 2.11L8.09 9.91a16 16 0 0 0 6 6l1.27-1.27a2 2 0 0 1 2.11-.45 12.84 12.84 0 0 0 2.81.7A2 2 0 0 1 22 16.92z"/></svg>(16) 99135-8579</span>
      <span class="ct"><svg viewBox="0 0 24 24"><rect width="20" height="20" x="2" y="2" rx="5" ry="5"/><path d="M16 11.37A4 4 0 1 1 12.63 8 4 4 0 0 1 16 11.37z"/><line x1="17.5" x2="17.51" y1="6.5" y2="6.5"/></svg>@spalhum</span>
      <span class="ct"><svg viewBox="0 0 24 24"><path d="M20 10c0 4.993-5.539 10.193-7.399 11.799a1 1 0 0 1-1.202 0C9.539 20.193 4 14.993 4 10a8 8 0 0 1 16 0"/><circle cx="12" cy="10" r="3"/></svg>R. Barão do Rio Branco, 964<br>Serrana, SP</span>
      <span class="ct"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg>Seg. a sex., 7h às 19h<br>Com hora marcada</span>
    </div>
  </div>
  <div class="coluna">
    <div class="caixa-qr"><img src="qr-agendamento.svg" alt="QR code para agendar online"></div>
    <span class="chamada">Agende<br>pelo celular</span>
  </div>
</template>

<script>
var p=new URLSearchParams(location.search), face=p.get('face')==='verso'?'verso':'frente';
document.documentElement.classList.add(face);
if(p.get('verniz')==='1')document.documentElement.classList.add('verniz');
document.getElementById('pagina').appendChild(document.getElementById('t-'+face).content.cloneNode(true));
// build.py confere este atributo antes de aceitar o PDF: sem Montserrat o desenho muda.
document.fonts.ready.then(function(){
  var usadas=face==='frente'?[['300 40px Montserrat','Humberto Bove'],['400 20px Montserrat','MASSOTERAPEUTA']]:[['400 20px "DM Sans"','Massagem']];
  document.documentElement.dataset.fontes=usadas.every(function(u){return document.fonts.check(u[0],u[1])})?'ok':'erro';
});
</script>
</body></html>
